name: WPF startup smoke

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile and launch WPF startup smoke
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Resolve-Path '.\source'
          $generated = & (Join-Path $source 'prepare-trainer-source.ps1') -Source (Join-Path $source 'TrainerApp.cs') -Output (Join-Path $env:RUNNER_TEMP 'TrainerApp.generated.cs')
          $framework = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319'
          $compiler = Join-Path $framework 'csc.exe'
          $references = @('System.dll','System.Core.dll','System.Web.Extensions.dll','WPF\WindowsBase.dll','WPF\PresentationCore.dll','WPF\PresentationFramework.dll','System.Xaml.dll') | ForEach-Object { '/reference:' + (Join-Path $framework $_) }
          $resource = '/resource:' + (Join-Path $source 'MainWindow.xaml') + ',PywelTrainer.MainWindow.xaml'
          $smoke = Join-Path $env:RUNNER_TEMP 'PywelTrainer.StartupSmoke.exe'
          & $compiler /nologo /target:exe /platform:x64 /optimize- /debug:full /utf8output /main:StartupSmoke ('/out:' + $smoke) $resource @references $generated (Join-Path $source 'StartupSmoke.cs')
          if ($LASTEXITCODE -ne 0) { throw 'Smoke test compilation failed.' }
          & $smoke
          if ($LASTEXITCODE -ne 0) { throw 'Smoke test failed.' }
